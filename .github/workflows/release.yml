# Al publicar una etiqueta vX.Y.Z: prueba, arma la versión portable para Windows y la sube como Release.
name: Release portable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Pruebas
        run: python -m pytest -q tests
      - name: Armar la versión portable (Python oficial verificado + librerías)
        run: python scripts/empaquetar.py
      - name: Publicar el Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag (Get-ChildItem dist\*.zip).FullName (Get-ChildItem dist\*.sha256).FullName `
            --title "CoraNotes $tag" --notes-file docs/release-notes.md
